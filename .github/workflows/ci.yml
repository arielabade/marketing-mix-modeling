name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ruff==0.14.0
      - run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev]"
      - name: unit and contract tests
        run: pytest -m "not e2e"

  e2e:
    # Whole pipeline (geo-lift -> MMM with and without calibration -> optimiser -> API)
    # on the small parquet profile. Same code path as a full run, less sampling.
    runs-on: ubuntu-latest
    needs: test
    env:
      MMM_PROFILE: small
      MMM_DATA_SOURCE: parquet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev]"
      - run: pytest -m e2e

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tecela-mmm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
